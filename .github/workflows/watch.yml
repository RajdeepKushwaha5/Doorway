name: Watch the fleet

# Scrapers in CI, with nobody watching.
#
# The scheduler on the worker already observes collectors on its own interval.
# This exists for a different reason: a scheduled run whose result is a green
# check is the only form of "the data is still good" that a team actually sees,
# because it appears in the same place as their tests.
#
# It runs in two halves so a failure is attributable. `observe` asks the API for
# a fresh reading, which costs Bright Data page loads and needs a token.
# `verify` then reports whether the fleet is currently verified, and needs no
# credentials at all, so it still runs on a fork.

on:
  schedule:
    # Every six hours, matching the collector interval the worker defaults to.
    # Monitoring is about catching a redesign, which happens over days; polling
    # harder mostly spends the free-tier allowance faster.
    - cron: '0 */6 * * *'
  workflow_dispatch:

# A late run must never overlap an earlier one: two observations of the same
# collector at once would spend double the page loads for one verdict.
concurrency:
  group: watch-the-fleet
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  observe:
    name: Observe every collector
    runs-on: ubuntu-latest
    # A fork has no admin token. Skipping is correct: the verify job below
    # still runs and still reports, so the workflow stays useful without it.
    if: github.repository == 'prabhatkumar67/notice'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm install

      - name: Build
        run: npm run build --workspace backend

      - name: Observe
        env:
          NOTICE_API_BASE: https://notice-api-0vfo.onrender.com
          NOTICE_ADMIN_TOKEN: ${{ secrets.NOTICE_ADMIN_TOKEN }}
        # The API sleeps on a free tier, so the first call wakes it. Failing the
        # job over a cold start would train everyone to ignore this workflow.
        run: |
          if [ -z "$NOTICE_ADMIN_TOKEN" ]; then
            echo "NOTICE_ADMIN_TOKEN is not set; nothing to observe."
            exit 0
          fi
          curl -s -m 120 "$NOTICE_API_BASE/api/health" > /dev/null || true
          npm run live -- status || true
          npm run live -- observe-all || npm run live -- status

  verify:
    name: Is the data currently verified
    runs-on: ubuntu-latest
    needs: observe
    # Runs whether or not observing happened, including when it was skipped.
    if: always()
    steps:
      - uses: actions/checkout@v4

      # The same action any consumer would drop into their own pipeline. It
      # reports here rather than failing, because this repository's demo API is
      # on a free plan and a red X caused by a sleeping service teaches nobody
      # anything. A real consumer sets fail-on-unverified to true.
      - uses: ./actions/verify
        id: gate
        continue-on-error: true
        with:
          api-base: https://notice-api-0vfo.onrender.com
          fail-on-unverified: 'false'

      - name: Summarise
        run: |
          echo "### Fleet verification" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Status: \`${{ steps.gate.outputs.status || 'unknown' }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Two independent Bright Data sensors read each watched page." >> "$GITHUB_STEP_SUMMARY"
          echo "A value they disagree on is withheld rather than published." >> "$GITHUB_STEP_SUMMARY"
