# Doorway continuous integration verification workflow
name: Doorway CI Verification

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # A fresh clone with nothing but npm install is the reproducibility
      # claim in the README. This job is what makes that claim checkable.
      - name: Install
        run: npm install

      - name: Typecheck and build all workspaces
        run: npm run build

      # Errors only. The config is deliberately small, so anything it reports
      # is something a reader would have tripped over.
      - name: Lint
        run: npm run lint -- --max-warnings 0

      # No network, no Bright Data credentials, no credits spent. The whole
      # detection-to-blocked-repair loop runs against a scripted client.
      - name: Test
        run: npm test

      - name: Assert no secrets are committed
        run: |
          if git ls-files | grep -E '(^|/)\.env$|\.env\.(local|production)$'; then
            echo "An environment file is tracked in git."
            exit 1
          fi
          # docs/evidence is excluded from the hex rule on purpose. Those
          # artifacts carry SHA-256 contentHash values, the digest of the page
          # body a witness read and the exact string the certificate verifier
          # re-derives. Removing them would destroy the evidence they exist to
          # be. The rule below scans that directory for credential shapes
          # instead, so the exclusion narrows the check rather than dropping it.
          if git grep -nE '\b[a-f0-9]{32,}\b' -- ':!*.lock' ':!package-lock.json' ':!*.md' ':!docs/evidence/**'; then
            echo "A long hex string that looks like an API key is committed."
            exit 1
          fi
          if git grep -nEi 'bearer [a-z0-9]{20,}|api[_-]?key|_TOKEN[=:]' -- 'docs/evidence/**'; then
            echo "A credential-shaped string is committed under docs/evidence."
            exit 1
          fi
          echo "No tracked env files and no key-shaped strings."

  # NOTICE gating on NOTICE. Reports rather than blocks, because the demo API
  # runs on a free tier that sleeps after fifteen minutes idle, and a CI job
  # that fails because a service was asleep teaches people to ignore it.
  #
  # A real consumer would set fail-on-unverified to true, which is the point:
  # a pipeline already refuses to ship on a failing test, and this makes it
  # refuse to ship on data nobody has checked.
  verify-data:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: ./actions/verify
        with:
          api-base: https://notice-api-0vfo.onrender.com
          fail-on-unverified: 'false'
