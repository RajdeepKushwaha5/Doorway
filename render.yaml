# Render blueprint for the Doorway Trust Engine API and controlled fixture.
#
# The dashboard goes to Vercel and is not defined here. It needs no config file:
# set the project's Root Directory to `frontend` and take every default. Vercel
# detects the npm workspace root on its own and installs from there. Overriding
# installCommand is what breaks that, because the override runs inside
# frontend/ and scopes the install to one workspace, leaving the build unable
# to resolve tailwindcss.
#
# Two services, both on the free plan.
#
# The API runs the monitoring worker in its own process, via
# NOTICE_RUN_WORKER_IN_PROCESS. That is not laziness: the file store lives on
# the instance's filesystem, and Render's persistent disks require a paid plan,
# so a separate worker service would have its own filesystem and its own
# divergent copy of every incident. One process owning both is the only correct
# arrangement without shared storage.
#
# To split them later, add a paid plan with a shared disk or swap FileStore for
# Postgres behind the existing Store interface, then set
# NOTICE_RUN_WORKER_IN_PROCESS to false and add a `type: worker` service.
#
# Free-plan caveats worth knowing before you record anything:
#   - services spin down after 15 minutes idle, so the first request after a
#     quiet period is slow. Warm both URLs before a demo.
#   - there is no persistent disk, so a redeploy resets the store. Re-seed or
#     re-run collectors afterwards.
#
# Live discovery is public by necessity: it is the route a student uses, and
# neither they nor anybody judging this can be handed an admin token. It spends
# real Web Unlocker requests, roughly one per search plus one per page opened,
# so it is capped per caller and by a global hourly ceiling in the code. The
# ceiling is what actually protects the account; raise it only if you have
# budget to lose.

services:
  - type: web
    name: doorway-api
    runtime: node
    plan: free
    region: oregon
    rootDir: .
    buildCommand: npm install && npm run build --workspace backend
    startCommand: npm run start --workspace backend
    healthCheckPath: /api/health
    # Tracks main. The deployed API sat on a build old enough to predate the
    # Doorway routes entirely, because every deploy had to be remembered by
    # hand, and nothing about the running service said it was behind.
    #
    # The branch is named explicitly. A blueprint that does not say which
    # branch it follows leaves that to whatever the dashboard was last set to,
    # which is exactly the kind of state that cannot be read from the
    # repository and therefore cannot be trusted from it.
    branch: main
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 22.11.0
      # Render assigns the port. `next start` and the API both read PORT.
      - key: NOTICE_RUN_WORKER_IN_PROCESS
        value: "true"
      # Required. Mutating routes are disabled entirely when this is unset,
      # rather than defaulting to open.
      - key: NOTICE_ADMIN_TOKEN
        sync: false
      - key: BRIGHTDATA_API_KEY
        sync: false
      # Without this the witness falls back to the bdata CLI, which is not
      # installed here, and the independent sensor cannot run at all.
      - key: BRIGHTDATA_UNLOCKER_ZONE
        sync: false
      # Pin where the witness fetches from. Two sensors are only comparable
      # when they saw the same page, and an unpinned exit can differ between
      # two calls to the same URL.
      - key: BRIGHTDATA_UNLOCKER_COUNTRY
        value: us
      # Where live discovery appears to search from. Funding pages are
      # frequently geo-fenced and search results differ by country, so a
      # student in India asking for Indian scholarships should be searched for
      # from India. Unrelated to the witness country above, which is pinned to
      # keep two sensors comparable rather than to localise anything.
      - key: DISCOVERY_COUNTRY
        value: in
      # Where the seeded opportunity collector points.
      #
      # The seed file used to hardcode the fixture's hostname, so a fresh
      # deploy came up seeding collectors aimed at the previous deployment.
      # They registered cleanly and watched a host with nothing to do with this
      # instance, which looks like a working dashboard and is worse than an
      # empty one. Change both if you rename the lab service.
      - key: DOORWAY_LAB_URL
        value: https://doorway-lab.onrender.com
      - key: DOORWAY_LAB_HOST
        value: doorway-lab.onrender.com
      # Set to the deployed dashboard origin once Vercel has given you one.
      - key: NOTICE_CORS_ORIGIN
        sync: false
      # Six hours. Monitoring is about catching a redesign, which happens over
      # days, and polling harder mostly burns credits.
      - key: NOTICE_MIN_INTERVAL_S
        value: 21600
      - key: NOTICE_MAX_PER_TICK
        value: 5
      # Both sensors draw from the account's 5,000-a-month free tier, so an
      # aggressive interval spends it with nothing visibly going wrong.
      - key: NOTICE_MONTHLY_PAGE_LOAD_BUDGET
        value: 4000
      # Slack, Discord or any inbound webhook. Without it an incident opens
      # and nobody is told, which is indistinguishable from no detection.
      - key: NOTICE_WEBHOOK_URL
        sync: false
      - key: NOTICE_DASHBOARD_URL
        sync: false
      # File incidents as GitHub issues. Needs a token with issues: write.
      - key: NOTICE_GITHUB_REPO
        sync: false
      - key: NOTICE_GITHUB_TOKEN
        sync: false
      # Lets an issue embed the incident screenshot.
      - key: NOTICE_PUBLIC_API_URL
        sync: false

  # DriftMart is the controlled fault-injection fixture that Bright Data
  # scrapes. It must be a running instance rather than serverless functions:
  # its current mode is stored on disk, and on an ephemeral per-request
  # filesystem a mode switch would apply to some requests and not others,
  # which looks exactly like a flaky scraper and wastes an hour on demo day.
  - type: web
    name: doorway-lab
    runtime: node
    plan: free
    region: oregon
    rootDir: .
    buildCommand: npm install && npm run build --workspace driftmart
    startCommand: npm run start --workspace driftmart
    branch: main
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 22.11.0
      - key: DRIFTMART_ADMIN_TOKEN
        sync: false
